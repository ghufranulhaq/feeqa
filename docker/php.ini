; Applied in every environment (base image). Demo/production tune further via
; environment-specific overrides in compose files if ever needed.

memory_limit = 512M
upload_max_filesize = 25M
post_max_size = 25M
max_execution_time = 60
date.timezone = UTC

; Proof uploads and media reviews are the biggest payloads the app accepts;
; 25M matches the largest single-file limit in the specs with headroom.
