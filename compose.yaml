# Local development (plan D22). Everything runs in containers — no local PHP
# or Node needed. See README.md for `make up` / `make install` / ...

name: feeqa

x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: dev
  image: feeqa-app:dev
  working_dir: /var/www/html
  volumes:
    - .:/var/www/html
  env_file:
    - .env
  depends_on:
    postgres:
      condition: service_healthy

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./public:/var/www/html/public:ro
      - caddy_data:/data
    depends_on:
      - app
      - mailpit

  app:
    <<: *app
    command: php-fpm

  queue:
    <<: *app
    command: php artisan queue:work --tries=3 --sleep=1

  scheduler:
    <<: *app
    command: php artisan schedule:work

  ssr:
    <<: *app
    # SSR is optional in local (constitution/plan D26); it rebuilds once at
    # container start. Restart it to pick up server-rendered page changes.
    command: sh -c "npm run build:ssr && php artisan inertia:start-ssr"

  vite:
    <<: *app
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-feeqa}
      POSTGRES_USER: ${DB_USERNAME:-feeqa}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-feeqa}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${DB_FORWARD_PORT:-5432}:5432"

  mailpit:
    image: axllent/mailpit:latest
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  postgres_data:
  caddy_data:
